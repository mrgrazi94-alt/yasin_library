<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - مكتبة ياسين المولى</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; direction: rtl; }
        
        /* شريط العلوي (Header) */
        header { background: #0f2027; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        .logo-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #d4af37; background-color: white; }
        .logo-text { font-size: 1.8rem; font-weight: bold; color: #ffffff; }
        .logo-text span { color: #d4af37; }
        
        .back-btn { background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 10px 20px; text-decoration: none; border-radius: 25px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: rgba(212, 175, 55, 0.1); }

        /* محتوى السلة */
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        .cart-items { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .cart-title { font-size: 1.5rem; border-right: 5px solid #d4af37; padding-right: 10px; margin-bottom: 25px; color: #0f2027; }
        
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .item:last-child { border-bottom: none; }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .item-name { font-size: 1.1rem; font-weight: bold; color: #2c3e50; }
        .item-price { font-size: 1.1rem; font-weight: bold; color: #27ae60; margin-top: 5px; }
        .remove-btn { color: #e74c3c; text-decoration: none; font-weight: bold; padding: 8px 15px; border-radius: 8px; background: #fdf0ed; transition: 0.2s; }
        .remove-btn:hover { background: #fadbd8; }

        /* ملخص الطلب والفورم */
        .checkout-box { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: fit-content; }
        .total-price { font-size: 1.5rem; font-weight: bold; color: #0f2027; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .total-price span { color: #27ae60; font-size: 1.6rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; font-size: 0.95rem; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 1rem; transition: 0.3s; }
        .form-control:focus { border-color: #d4af37; box-shadow: 0 0 5px rgba(212, 175, 55, 0.3); }
        
        .submit-btn { background: #0f2027; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover:not(:disabled) { background: #d4af37; color: #000; }
        
        .empty-cart { text-align: center; padding: 50px 20px; font-size: 1.2rem; color: #7f8c8d; }
    </style>
</head>
<body>

    <header>
        <!-- الشعار (البوابة السرية للوحة التحكم) -->
        <div id="secretAdminBtn" class="logo-container">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="شعار المكتبة" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">مكتبة <span>ياسين المولى</span></div>
        </div>
        <a href="/" class="back-btn">🏠 العودة للمتجر</a>
    </header>

    <div class="container">
        <!-- قائمة المشتريات -->
        <div class="cart-items">
            <h2 class="cart-title">محتويات السلة</h2>
            
            {% if cart %}
                <!-- هنا التعديل السحري: نقرأ الـ ID والتفاصيل من القاموس -->
                {% for product_id, item in cart.items() %}
                <div class="item">
                    <div class="item-info">
                        <!-- صورة المنتج -->
                        <img src="{{ url_for('static', filename=item.image) }}" alt="{{ item.name }}" class="item-img" onerror="this.src='https://via.placeholder.com/70?text=بدون+صورة'">
                        <div>
                            <div class="item-name">{{ item.name }}</div>
                            <div class="item-price">{{ item.price }} د.ع</div>
                        </div>
                    </div>
                    <!-- دالة الحذف تأخذ رقم المنتج -->
                    <a href="{{ url_for('remove_from_cart', product_id=product_id) }}" class="remove-btn">❌ حذف</a>
                </div>
                {% endfor %}
            {% else %}
                <div class="empty-cart">
                    <p style="font-size: 3rem; margin-bottom: 10px;">🛒</p>
                    <p>سلة المشتريات فارغة حالياً.</p>
                    <br>
                    <a href="/" style="color: #d4af37; font-weight: bold; text-decoration: none; font-size: 1.1rem;">تصفح المنتجات من هنا</a>
                </div>
            {% endif %}
        </div>

        <!-- نموذج إتمام الطلب -->
        <div class="checkout-box">
            <div class="total-price">
                المجموع الكلي: 
                <span>{{ total }} د.ع</span>
            </div>
            
            <form action="/checkout" method="POST">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" name="name" class="form-control" required placeholder="مثال: علي محمد">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="text" name="phone" class="form-control" required placeholder="07xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل:</label>
                    <textarea name="address" class="form-control" required placeholder="المحافظة، المنطقة، أقرب نقطة دالة..." rows="3"></textarea>
                </div>
                
                <!-- الزر يتقفل إذا السلة فارغة -->
                <button type="submit" class="submit-btn" {% if not cart %}disabled style="opacity: 0.5; cursor: not-allowed;"{% endif %}>تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

    <!-- كود البوابة السرية (3 ضغطات للوحة التحكم) -->
    <script>
        let clickCount = 0;
        let clickTimer;

        document.getElementById('secretAdminBtn').addEventListener('click', function() {
            clickCount++; 
            if (clickCount === 3) {
                window.location.href = '/login';
            }
            clearTimeout(clickTimer);
            clickTimer = setTimeout(function() {
                clickCount = 0;
            }, 1500);
        });
    </script>
</body>
</html>
