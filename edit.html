<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل المنتج - الإدارة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; direction: rtl; }
        
        /* الشريط العلوي */
        header { background: #0f2027; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d4af37; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #d4af37; background-color: white; }
        .logo-text { font-size: 1.6rem; font-weight: bold; color: #ffffff; }
        .logo-text span { color: #d4af37; }
        
        .back-btn { background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 10px 20px; text-decoration: none; border-radius: 25px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: rgba(212, 175, 55, 0.1); }

        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-top: 5px solid #3498db; }
        .card-title { font-size: 1.5rem; border-right: 5px solid #3498db; padding-right: 10px; margin-bottom: 25px; color: #0f2027; }
        
        /* فورم التعديل */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; font-size: 0.95rem; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 1rem; transition: 0.3s; background: #f9f9f9; }
        .form-control:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); background: white; }
        
        .current-img-container { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        .current-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid #ccc; }
        .img-note { font-size: 0.85rem; color: #7f8c8d; }

        .submit-btn { background: #3498db; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .submit-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="شعار المكتبة" class="logo-img" onerror="this.src='https://via.placeholder.com/55?text=لوجو'">
            <div class="logo-text">تعديل <span>المنتج</span></div>
        </div>
        <a href="/admin" class="back-btn">🔙 العودة للوحة التحكم</a>
    </header>

    <div class="container">
        <div class="card">
            <h2 class="card-title">تحديث بيانات المنتج</h2>
            
            <form action="/edit/{{ product.id }}" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <!-- وضعنا القيمة الحالية للمنتج في الحقل -->
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>
                
                <div class="form-group">
                    <label>السعر (بالدينار):</label>
                    <input type="number" name="price" class="form-control" value="{{ product.price }}" required>
                </div>
                
                <div class="form-group">
                    <label>الصورة الحالية:</label>
                    <div class="current-img-container">
                        <img src="{{ url_for('static', filename=product.image) }}" class="current-img" onerror="this.src='https://via.placeholder.com/60?text=صورة'">
                        <span class="img-note">اختر صورة جديدة بالأسفل فقط إذا أردت تغيير هذه الصورة.</span>
                    </div>
                    <!-- حقل اختيار الصورة (غير مطلوب required حتى يكدر يغير بس السعر إذا يحب) -->
                    <input type="file" name="image" class="form-control" accept="image/*">
                </div>
                
                <button type="submit" class="submit-btn">💾 حفظ التعديلات</button>
            </form>
        </div>
    </div>

</body>
</html>
