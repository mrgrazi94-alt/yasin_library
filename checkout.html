<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تثبيت طلب التوصيل - مكتبة ياسين المولى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-2xl shadow-sm border w-full max-w-lg space-y-6">
        <div>
            <h1 class="text-2xl font-bold">🚚 تفاصيل عنوان التوصيل</h1>
            <p class="text-sm text-slate-500 mt-1">المبلغ المطلوب الإجمالي: <span class="font-extrabold text-emerald-600">{{ total }} د.ع</span></p>
        </div>

        <form action="/checkout" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">الاسم الكامل</label>
                <input type="text" name="name" required class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">رقم الهاتف (للتواصل عند التوصيل)</label>
                <input type="text" name="phone" required class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">العنوان بالتفصيل (المحافظة، المنطقة، أقرب نقطة دالة)</label>
                <textarea name="address" rows="3" required class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-600"></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">ملاحظات إضافية (اختياري)</label>
                <input type="text" name="notes" class="w-full border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-600">
            </div>
            <div class="flex space-x-3 space-x-reverse pt-2">
                <button type="submit" class="flex-grow bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-md text-sm">تأكيد وإرسال الطلب</button>
                <a href="/cart" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium px-6 py-3 rounded-xl text-center text-sm">العودة للسلة</a>
            </div>
        </form>
    </div>
</body>
</html>
